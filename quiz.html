<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TOPIK 6級 読解ドリル</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#222;--sub:#666;--ac:#2b5fd9;--ok:#1a8a4a;--ng:#c8372d;--bd:#ddd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17181b;--card:#222428;--tx:#eee;--sub:#aaa;--ac:#7aa2ff;--ok:#4cc582;--ng:#ff7a70;--bd:#3a3d44}}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Hiragino Sans","Noto Sans JP","Noto Sans KR",sans-serif;line-height:1.7}
.w{max-width:680px;margin:0 auto;padding:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
.p{font-size:16px;white-space:pre-wrap}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;width:100%;text-align:left;margin:6px 0;cursor:pointer}
button.p1{background:var(--ac);color:#fff;text-align:center;border:0}
button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
button.ng{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 18%,var(--card))}
.s{color:var(--sub);font-size:13px}.bar{height:6px;background:var(--bd);border-radius:3px}.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.v{background:var(--bg);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:14px}.v span{font-weight:700;color:var(--ac)}.sp{cursor:pointer;margin:0 6px;font-weight:400!important}.dr{border:1px solid var(--bd);border-radius:8px;padding:10px;margin:8px 0}input{font:inherit;width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}a{color:var(--ac)}.t{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd);margin-right:6px}
</style></head><body><div class="w" id="app"></div>
<script>
const Q=[
["64回-31","병원의 규모에 따라 약값을 달리하는 제도가 생겼다. 감기와 같이 가벼운 병에 종합병원에서 진료를 받으면 （　） 만든 것이다. 같은 약을 동네 의원 처방전으로 사면 약값이 더 적게 나온다.","「穴埋め」",["환자가 약값을 조금 더 내게","개인이 약값을 비교할 수 있게","병원에서 병원비를 올리지 못하게","병원비의 일부를 병원에서 지원하게"],0,"小さな病院なら薬代が安い＝大病院は少し高い。目的は大病院への集中を減らすこと。",[["종합병원","総合病院"],["의원","町の医院"],["처방전","処方箋"],["약값","薬代"],["몰리다","集中する・殺到する"],["부담하다","負担する"]],"病院の規模によって個人が負担する薬代を変える制度ができた。風邪のような比較的軽い病気で総合病院で診療を受けると、（患者が薬代を少し多く払うように）作られたものだ。同じ薬を町の医院の処方箋で買うと薬代はより少なくなる。この制度で、患者が信頼から総合病院にばかり集中する現象を減らせると予想される。"],
["64回-30","취재 경계선은 취재 과열로 생기는 불상사를 예방하려는 것이다. 법으로 정해져 있지 않지만 언론계가 이 선을 지키려 노력하는 것은 （　） 순간 원활한 보도가 어려워진다는 것을 잘 알기 때문이다.","「穴埋め」",["취재 정보를 공유하는","취재 경계선이 무너지는","취재 내용을 잘못 해석하는","취재 경계선이 새로 설정되는"],1,"線を守る理由＝線が崩れると取材が混乱し報道が難しくなるから。",[["취재","取材"],["경계선","境界線"],["과열","過熱"],["불상사","不祥事"],["원활하다","円滑だ"],["무너지다","崩れる"]],"取材境界線は、取材の過熱で起こりうる不祥事を防ぐために設けたものだ。法で定められてはいないが、報道界がこの線を守ろうと努力するのは、（取材境界線が崩れる）瞬間、円滑な報道が難しくなることを誰よりもよく知っているからだ。"],
["64回-29","무지개는 빛이 공기 중의 물방울을 통과할 때 굴절되어 나타난다. 이때 （　） 않으면 무지개가 만들어지기 어렵다. 공기에 먼지 등이 섞이면 물방울들이 먼지 주위로 모여 빛이 통과하는 것을 막기 때문이다.","「穴埋め」",["해가 뜨지","비가 그치지","빛이 약하지","공기가 깨끗하지"],3,"後ろの理由「空気に埃が混ざると…」から、空気がきれいでないと虹ができにくい。",[["굴절되다","屈折する"],["물방울","水滴"],["오염 물질","汚染物質"],["섞이다","混ざる"],["막다","遮る・防ぐ"]],"虹は、光が空気中の水滴を通過するとき屈折して現れる現象だ。そのため雨が上がった直後に日が差すと虹がよくできる。このとき（空気がきれいで）ないと虹はできにくい。空気にほこりなどの汚染物質が混ざると、水滴がほこりの周りに集まり、光が通過するのを遮るからだ。"],
["91回-30","풍부한 자원은 경제 성장의 필요조건이지 충분조건은 아니다. 풍부한 천연자원을 갖추고 있음에도 （　） 경우도 있다. 자원에만 의존해 제조업이나 서비스업 등에 투자를 하지 않게 되는 것이다.","「穴埋め」",["제조업에 의존하려는","자원을 생산하지 못하는","경제 발전을 이루지 못하는","기술 개발에 무리하게 투자하는"],2,"「資源が豊富でも〜」＝逆接なので発展できない例。後ろの「投資しなくなる」とも合う。",[["필요조건","必要条件"],["충분조건","十分条件"],["의존하다","依存する"],["빈약하다","乏しい"],["투자","投資"]],"豊富な資源は経済成長の必要条件であって、十分条件ではない。豊富な天然資源を備えていても（経済発展を遂げられない）場合もある。資源だけに頼り、経済成長の中心産業である製造業やサービス業などへの投資をしなくなるのだ。一方、天然資源が乏しくても、新しい技術開発や教育で生産能力を高める国もある。"],
["91回-31","중세 시대에는 성직자가 의사를 겸해 검은색 가운을 입고 진료를 했다. 그런데 검은색 옷은 세균으로 오염된 얼룩이 잘 보이지 않았다. 이후 세균 감염의 위험성에 대한 인식이 높아지면서 （　） 가운의 색이 흰색으로 바뀌었다.","「穴埋め」",["염색하기 편하게","환자와 구분이 되도록","오염이 쉽게 눈에 띄도록","밝은 이미지를 줄 수 있게"],2,"黒だと汚れが見えない→白に変えた＝汚れが目立つように。",[["겸하다","兼ねる"],["성직자","聖職者"],["얼룩","汚れ・しみ"],["감염","感染"],["눈에 띄다","目立つ"]],"医者の姿を思い浮かべると、私たちは普通白衣を思い出す。ところが医者の白衣は最初から白だったわけではない。中世には聖職者が医者を兼ねることが多く、聖職者用の黒い服で診療した。しかし黒い服は、細菌による汚れが目立たなかった。その後、細菌感染の危険性への認識が高まり、（汚れがすぐ目に付くように）白衣の色が白に変わった。"],
["102回-30","악어는 먹잇감을 잡아먹으면서 눈물을 흘린다. 음식을 씹을 때 눈물샘과 턱을 움직이는 신경이 연결되어 있기 때문이다. 이 눈물 때문에 악어는 마치 다른 동물을 잡아먹으면서 （　） 것처럼 보인다.","「穴埋め」",["두려움에 떠는","죄책감을 느끼는","갈증을 해소하는","배부름에 만족하는"],1,"「ワニの涙」＝偽りの涙。獲物を食べながら泣く＝罪悪感を感じているように見える。",[["비유하다","例える"],["눈물샘","涙腺"],["거짓","偽り"],["가식적","わざとらしい・偽りの"],["죄책감","罪悪感"],["갈증","のどの渇き"]],"誰かに害を与えておいて、申し訳なさそうなふりをして流す偽りの涙を「ワニの涙」に例える。実際ワニは獲物を食べながら涙を流す。涙腺を担当する神経とあごを動かす神経がつながっているため、食べるときに涙が出るのだ。この涙のせいで、ワニはまるで他の動物を捕って食べながら（罪悪感を感じている）ように見える。「ワニの涙」という表現は、人間のわざとらしい行為をワニの生理現象に例えたものだ。"],
["102回-31","음료수 병과 같이 액체를 담는 용기는 대부분 원기둥 모양이다. 원기둥을 선택하는 가장 큰 이유는 （　） 위해서이다. 밑면의 넓이가 같을 때 원의 둘레가 가장 짧다. 둘레를 감싸는 재료가 가장 적게 든다.","「穴埋め」",["보기 좋게 만들기","보관을 편리하게 하기","손으로 잡기 편하게 하기","용기의 제작 비용을 줄이기"],3,"材料が少なく済む→生産費を下げる、と最後に明示されている。",[["원기둥","円柱"],["둘레","周囲・外周"],["밑면","底面"],["정사각형","正方形"],["생산비","生産費"],["제작 비용","制作費"]],"飲料水のボトルのように液体を入れる容器は、ほとんどが円柱形だ。円柱を選ぶ最大の理由は（容器の制作費を減らす）ためだ。例えば底面が正方形、正三角形、円の場合を比べよう。底面の広さが同じ100cm²のとき、周囲の長さはそれぞれ40cm、46cm、35cmほどで、円が最も短い。したがって同じ量の液体を入れる条件なら、周りを囲む材料が最も少なくて済む円柱で作り、生産費を下げようとするのだ。"],
["102回-16","북극여우는 계절에 따라 털 색깔을 바꾼다. 이러한 털 색깔의 변화로 북극여우는 몸을 숨길 곳이 없는 북극의 환경에서도 천적으로부터 자신을 보호하고 사냥할 때 （　） 수 있다.","「穴埋め」",["동료와 무리를 이룰","먹잇감에 몰래 다가갈","체온을 적절히 유지할","발자국을 남기지 않을"],1,"保護色の効果＝敵から隠れ、狩りでは獲物にこっそり近づける。",[["천적","天敵"],["사냥하다","狩りをする"],["몰래","こっそり"],["흙","土"],["숨기다","隠す"]],"ホッキョクギツネは、季節によって毛の色を変える動物だ。毛は冬には雪のような白、夏には岩や土に似た茶色に変わる。この毛色の変化によって、ホッキョクギツネは身を隠す場所のない北極の特殊な環境でも、天敵から身を守り、狩りのとき（獲物にこっそり近づく）ことができる。"],
["60回-45","원고 마감이 임박하면 사람은 본능적으로 놀라운 집중력을 발휘한다. 그래서 시간 부족 상태가 되어야만 일을 효율적으로 할 수 있다고 믿는 사람이 많다. 그러나 효율성만 믿고 （　） 것은 어리석은 일이다. 시간에 쫓기면 사람들은 한 가지에만 집중할 뿐 다른 것에는 주의를 기울이지 못하게 된다. 소방관 사고도 그런 예다.","「穴埋め」",["성급히 일을 처리하는","무턱대고 일을 미루는","관심사를 무한히 늘리는","전적으로 하나에만 매달리는"],1,"「時間不足になってからこそ効率的にできる」と信じる＝締め切り間際まで仕事を後回しにする。「効率性だけを信じて仕事を先延ばしにするのは愚か」という文脈。④は後ろの説明（一つにしか集中できない）に引っ張られた誤答。公式正答は②。",[["집중력","集中力"],["어리석다","愚かだ"],["주의를 기울이다","注意を払う"],["매달리다","しがみつく"],["성급히","性急に"],["무턱대고","むやみに"],["미루다","先延ばしにする"]],"原稿の締め切りが迫ると、人は本能的に驚くべき集中力を発揮する。だから時間不足の状態になって初めて効率的に働けると信じる人が多い。しかし効率性だけを信じて（むやみに仕事を先延ばしにする）のは愚かなことだ。時間に追われると、人は一つのことにしか集中できず、他のことには注意を払えなくなる。消防隊員の事故もその例だ。"],
["64回-45","현재 우리가 지키고 있는 예법은 （　） 잘못된 예법이 전해져 온 것이다. 선조들은 음식을 많이 차리는 것보다 준비하는 마음과 정성을 중시했다. 형식보다 정성이 중요하다는 유교의 가르침을 지키고 있는 것이다.","「穴埋め」",["상차림이 간소화된","후손들의 바람이 반영된","유교의 본뜻을 살리지 못한","현실에 맞게 축소되지 않은"],2,"批判の対象は「本来の趣旨（정성）を活かせていない」形式主義の礼法。",[["비판하다","批判する"],["예법","礼法"],["정성","真心"],["간소하다","簡素だ"],["본뜻","本来の意味"],["살리다","活かす"]],"盛大で面倒な祭祀の準備のせいで、儒教の礼法を批判する人が多い。しかし今私たちが守っている礼法は、（儒教の本来の意味を活かせていない）誤った礼法が伝わってきたものだ。先祖は祭祀で良い料理をたくさん用意することより、その料理を準備する心と真心を重んじた。形式より真心が大切だという儒教の教えを守っているのだ。"],
["64回-39","왕관은 과거 지배 계층이 착용했던 대표적인 장신구이다. （㉠） 장식도 화려하게 더해져 왕의 지위를 돋보이게 했다. （㉡） 오늘날 왕관이 가졌던 힘과 지위의 의미는 약화되었으나…\n\n〈文〉그래서 백성들이 구하기 힘든 매우 귀하고 값비싼 재료로 만들어졌다.","「文挿入」どこに入る？",["㉠","㉡","㉢","㉣"],0,"「그래서」＝支配層が着けた→だから庶民に手に入らない貴重な材料。直後の「装飾も華やかに」に自然につながる。",[["왕관","王冠"],["장신구","装身具"],["지배 계층","支配階級"],["값비싸다","高価だ"],["돋보이다","際立つ"],["백성","民"]],"王冠は、昔の支配階級が着けた代表的な装身具だ。（㉠）飾りも華やかに加えられ、それを被る王の地位をより際立たせた。（㉡）今日、王冠が持っていた力や地位の意味は弱まったが…\n\n〈文〉そのため、民が手に入れにくい非常に貴重で高価な材料で作られた。"],
["91回-39","〈文〉그런데 심판이 아무리 위치 선정을 잘해도 필연적으로 선수의 몸에 가려서 볼 수 없는 사각지대가 생긴다.\n\n스포츠 경기에서 득점이나 반칙의 판정은 심판에 의해서 이루어진다.（㉠）이렇게 눈에 보이지 않는 곳에서 벌어진 상황에 대해서는 심판도 정확한 판단을 하기 어렵다.（㉡）비디오 판독은…","「文挿入」どこに入る？",["㉠","㉡","㉢","㉣"],0,"直後の「이렇게 눈에 보이지 않는 곳」が死角を受けている。",[["심판","審判"],["반칙","反則"],["판정","判定"],["사각지대","死角"],["판독","判読（リプレイ確認）"],["신뢰도","信頼度"]],"〈文〉ところが、審判がいくら位置取りがうまくても、必然的に選手の体に隠れて見えない死角が生じる。\n\nスポーツの試合で、得点や反則などの判定は審判によって行われる。（㉠）このように目に見えない所で起きた状況については、審判も正確な判断が難しい。（㉡）ビデオ判定は…"],
["102回-39","〈文〉사회적으로도 이들을 위한 재교육의 장이 충분히 마련되어 있지 않다.\n\n운동선수의 평균 은퇴 연령은 23.6세이다.（㉠）대부분 새 직업을 찾아야 한다.（㉡）하지만 개개인이 은퇴 이후의 삶을 준비할 여력이 없다.（㉢）이에 현역부터 직업 교육 등을 지원하는 구단이 많아지고 있다.（㉣）","「文挿入」どこに入る？",["㉠","㉡","㉢","㉣"],2,"「個人は準備する余裕がない」＋「社会的にも」→その直後。次の「이에（これに）」で球団の支援へ続く。",[["은퇴","引退"],["현역","現役"],["여력","余力"],["재교육","再教育"],["구단","球団"],["매진하다","打ち込む"]],"〈文〉社会的にも、彼らのための再教育の場が十分に用意されていない。\n\n運動選手の平均引退年齢は23.6歳と、非常に短い。（㉠）指導者の道を歩む少数の選手を除けば、大半の選手は引退後に新しい職を探さなければならない。（㉡）しかし選手は長い間運動だけに打ち込んできたので、個人が引退後の生活を準備する余裕がない。（㉢）これを受けて、現役のときから選手に職業教育などを支援する球団が増えている。"],

const app=document.getElementById('app');let qs,i,sc,wrong,done;

function home(){app.innerHTML=`<h2>TOPIK 6級 読解ドリル</h2><div class="c"><p>第60・64・91・102回 TOPIK II 読解の過去問から ${Q.length}問を収録（長文は要点を抜粋）。</p><p class="s">選択肢は4択、解答後に日本語で解説が出ます。</p><button class="p1" onclick="start(Q)">全問に挑戦</button><button class="p1" onclick="start(shuffle(Q).slice(0,8))">ランダム8問</button></div><p class="s">※正答は公式の正答表で確認済みです。解説・日本語訳・単語は作成したものです。</p>`}
